<!doctype html>
<html lang="<!-- figma:lang -->">
<head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title -->Log Manual Ticket - Admin Workstation</title>
    
    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        kptm: { crimson: '#A6192E', maroon: '#672728', dark: '#1F2937' },
                        semantic: { warning: '#FFF8E5', warningText: '#855A00', emptyText: '#166534' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .tap-effect:active { transform: scale(0.98); transition: transform 0.1s ease-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <!-- figma:head-end -->
</head>
<body class="bg-gray-100 text-gray-900 h-[844px] w-[390px] border border-gray-300 mx-auto flex flex-col justify-between overflow-hidden relative shadow-2xl">
    <!-- figma:body-start -->
    
    <!-- Admin Top Header -->
    <header class="bg-kptm-dark text-white px-5 py-4 flex justify-between items-center z-10 border-b border-gray-800">
        <div class="flex flex-col">
            <span class="font-bold text-lg leading-tight tracking-tight flex items-center gap-1.5">
                <i class="ph-fill ph-shield-check text-kptm-crimson"></i> Admin Workstation
            </span>
            <span class="text-[12px] opacity-75">KPTM Batu Pahat · Manual Entry</span>
        </div>
        <div class="w-[34px] h-[34px] rounded-full bg-gray-800 text-white border border-gray-600 flex items-center justify-center font-bold text-xs">
            ADM
        </div>
    </header>

    <!-- Scrollable Main Viewport -->
    <main class="flex-1 overflow-y-auto px-5 py-5 no-scrollbar pb-10">
        <!-- Back Link -->
        <a href="admin-dashboard.html" class="inline-flex items-center gap-1.5 text-gray-600 font-semibold text-[13px] mb-4 tap-effect">
            <i class="ph-bold ph-arrow-left"></i> Back to admin dashboard
        </a>

        <p class="text-[11px] font-bold tracking-[0.15em] text-gray-500 uppercase mb-1">ICT Maintenance Intake</p>
        <h1 class="text-[26px] leading-[32px] font-bold text-gray-900 mb-1">Log Manual Ticket</h1>
        <p class="text-[12px] text-gray-600 mb-4">Record walk-in, phone, or scheduled inspection fault reports.</p>

        <form action="admin-repairs.html" class="space-y-3.5">
            <!-- Reporter Type -->
            <div>
                <label class="block text-[12px] font-bold text-gray-700 mb-1">Reported Via *</label>
                <select class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-[12px] font-medium text-gray-800 focus:outline-none focus:border-kptm-crimson">
                    <option value="walkin" selected>Walk-in Student / Lecturer</option>
                    <option value="phone">Phone Call / WhatsApp Hotline</option>
                    <option value="routine">Routine ICT Audit Inspection</option>
                </select>
            </div>

            <!-- Reporter Info -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[12px] font-bold text-gray-700 mb-1">Reporter Name</label>
                    <input type="text" value="Lecturer Dr. Azman" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-[12px] font-medium text-gray-800 focus:outline-none focus:border-kptm-crimson">
                </div>
                <div>
                    <label class="block text-[12px] font-bold text-gray-700 mb-1">Contact / ID</label>
                    <input type="text" value="STAFF-4029" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-[12px] font-medium text-gray-800 focus:outline-none focus:border-kptm-crimson">
                </div>
            </div>

            <!-- Facility Selection -->
            <div>
                <label class="block text-[12px] font-bold text-gray-700 mb-1">Facility *</label>
                <select class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-[12px] font-medium text-gray-800 focus:outline-none focus:border-kptm-crimson">
                    <option value="nl2" selected>Networking Lab 2 (Computing Block L1)</option>
                    <option value="hm">Hardware Makerspace (Innovation Area GF)</option>
                    <option value="dr1">Discussion Room 1 (Learning Commons GF)</option>
                </select>
            </div>

            <!-- Target Equipment -->
            <div>
                <label class="block text-[12px] font-bold text-gray-700 mb-1">Equipment Identifier *</label>
                <input type="text" value="SW-NL2-01 (Cisco Network Switch)" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-[12px] font-medium text-gray-800 focus:outline-none focus:border-kptm-crimson">
            </div>

            <!-- Urgency Level -->
            <div>
                <label class="block text-[12px] font-bold text-gray-700 mb-1">Urgency & Triage Action *</label>
                <select class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-[12px] font-bold text-amber-800 bg-amber-50 focus:outline-none">
                    <option value="high">High Urgency — Isolate Item Immediately</option>
                    <option value="medium">Medium Urgency — Queue for Maintenance</option>
                    <option value="low">Low Urgency — Cosmetic / Minor Fix</option>
                </select>
            </div>

            <!-- Notes -->
            <div>
                <label class="block text-[12px] font-bold text-gray-700 mb-1">Admin Diagnostic Notes *</label>
                <textarea rows="2.5" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-[12px] font-medium text-gray-800 focus:outline-none focus:border-kptm-crimson">Port 12 emitting link drop errors during lab practical. Cable tester showed wire short. Item flagged for technician replacement.</textarea>
            </div>

            <!-- Submit Buttons -->
            <div class="pt-2 flex flex-col gap-2">
                <button type="submit" class="w-full bg-kptm-dark text-white font-bold py-3 rounded-xl text-[14px] tap-effect shadow-md text-center">
                    Log Ticket & Update Triage
                </button>
                <a href="admin-repairs.html" class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-2.5 rounded-xl text-[13px] text-center tap-effect">
                    Cancel
                </a>
            </div>
        </form>
    </main>

    <!-- Bottom Admin Console Status Bar -->
    <footer class="bg-kptm-dark text-gray-400 px-5 py-3 border-t border-gray-800 flex justify-between items-center text-[11px]">
        <span class="flex items-center gap-1.5 font-medium">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Ready for Input
        </span>
        <span class="font-mono">v2.4-admin</span>
    </footer>

    <!-- figma:body-end -->
</body>
</html>
